name: Architecture verification

on:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --legacy-peer-deps
      - run: npx tsx scripts/auditArchitecture.ts
      - run: npm run lint
      - run: npm test
      - run: npm run build
